
name: TaskFlow CI/CD

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - todo-list

  pull_request:
    branches:
      - todo-list

  workflow_dispatch:

jobs:
  quality-checks:
    name: Django Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py check

      - name: Check migration consistency
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py makemigrations --check --dry-run

      - name: Run automated tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-checks

    if: >
      github.ref == 'refs/heads/todo-list' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy hook secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}?ref=${GITHUB_SHA}"

      - name: Verify deployment health
        env:
          HEALTH_URL: https://py-scripts-lvc0.onrender.com/health/
        run: |
          echo "Waiting for the deployed application to become healthy..."

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 10 "$HEALTH_URL"; then
              echo ""
              echo "Deployment health check passed."
              exit 0
            fi

            echo "Attempt $attempt/30 failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Deployment health check failed."
          exit 1
